<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <title>HomeZapp - Manage Profile</title>
    <link rel="stylesheet" href="{% static 'css/generalPages.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="navbarHome">
        <h2>HomeZapp</h2>
        <div>
            <a href="{% url 'homepage' %}">Homepage</a> |
            <a href="{% url 'buyer_page' %}">Return to Dashboard</a> | 
            <a href="{% url 'wishlist_page' %}">Cart</a> |
            <a href="{% url 'logoutPage' %}">Logout</a> |
            <a href="{% url 'contact_page' %}">Contact</a>
        </div>
    </div>

    <h1 class="lesserTitle mt-3">Manage Profile</h1>
    <div class="smallForm">
    <h2>Edit Account Information</h2>
    <div class="smallFormInner">
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p style="color:green;">{{ success }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <p>
            <label>First Name:</label><br>
            <input type="text" name="first_name" value="{{ request.user.first_name }}" required>
        </p>
        
        <p>
            <label>Last Name:</label><br>
            <input type="text" name="last_name" value="{{ request.user.last_name }}" required>
        </p>

        <p>
            <label>Email Address:</label><br>
            <input type="email" name="email" value="{{ request.user.email }}" required>
        </p>

        <button type="submit" class="button_generic">
            Save Changes
        </button>
    </form>
    </div>
</div>
</body>
</html>
