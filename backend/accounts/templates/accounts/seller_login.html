<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Seller Login</title>
    <link rel="stylesheet" href="{% static 'css/generalPages.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="{% static 'js/general.js' %}"></script>
</head>
<body>
        <div class="navbarHome">
        <h2>HomeZapp</h2>
        <div>
            <a href="{% url 'homepage' %}">Homepage</a> |
            <a href="{% url 'loginPage' %}">Register/Login</a> |
            <a href="{% url 'seller_login_page' %}">Seller Login</a> |
            <a href="{% url 'seller_register_page' %}">Create Seller Account</a> |
            <a href="{% url 'dashboard_redirect' %}">Dashboard</a> |
            <a href="{% url 'contact_page' %}">Contact</a>
            
        </div>
    </div>
    
    <h1 class="lesserTitle mt-3">Seller Login</h1>

    <div class="smallForm">
    <div class="smallFormInner">
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label>Email:</label><br>
            <input type="text" name="email">
        </p>
        <p>
            <label>Password:</label><br>
            <input type="password" name="password">
        </p>
        <button type="submit" class="button_generic">Login</button>
    </form>
    </div></div>
</body>
</html>
