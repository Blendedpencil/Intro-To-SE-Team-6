<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Manage Seller Profile</title>
    <link rel="stylesheet" href="{% static 'css/generalPages.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

   <div class="navbarHome">
        <h2>HomeZapp</h2>
        <div>
            <a href="{% url 'homepage' %}">Homepage</a> |
            <a href="{% url 'dashboard_redirect' %}">Dashboard</a> |
            <a href="{% url 'contact_page' %}">Contact</a>
        </div>
    </div>
    

<h1 class="lesserTitle mt-3 mb-5">Manage Profile</h1>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

{% if success %}
<p style="color:green;">{{ success }}</p>
{% endif %}

<section>
    <div class="smallForm">
    <h2>Profile</h2>
<div class="smallFormInner">
    <form method="post">
        {% csrf_token %}

        <input type="text" name="name" placeholder="Display Name" value="{{ request.user.first_name }} {{ request.user.last_name }}">
        <br><br>

        <input type="email" name="email" placeholder="Email" value="{{ request.user.email }}">
        <br><br>

        <input type="text" name="phone" placeholder="Phone Number" value="{{ profile.phone|default:'' }}">
        <br><br>

        <textarea name="bio" placeholder="Bio / About Seller">{{ profile.bio|default:'' }}</textarea>
        <br><br>

        <button type="submit" class="button_generic">Save Profile</button>
    </form>
    </div></div>
</section>

<section>
    <h2>Account</h2>
    <p>Password change can be added later.</p>
</section>


</body>
</html>
